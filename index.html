<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sales Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="bar"><h1>Sales <span>Dashboard</span></h1></div></header>
<main>
  <div class="tools">
    <label>Period
      <select id="range"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="0">All time</option></select></label>
    <label>Data
      <select id="src"><option value="mine">My orders</option><option value="demo">Demo data</option></select></label>
    <button id="add">Add order</button>
    <button id="imp">Import CSV</button><input type="file" id="file" accept=".csv,text/csv">
    <button id="csv">Export CSV</button>
    <button id="tpl">Download CSV template</button>
    <button id="clr" class="danger">Clear my orders</button>
  </div>
  <p id="banner" class="banner" role="status"></p>
  <section class="kpis" id="kpis" aria-label="Key numbers"></section>
  <div class="grid2 g-a">
    <section class="card"><h2>Revenue over time</h2><div class="cv"><canvas id="cRev" role="img" aria-label="Revenue over time"></canvas></div></section>
    <section class="card"><h2>Sales by category</h2><div class="cv"><canvas id="cCat" role="img" aria-label="Sales by category"></canvas></div></section>
  </div>
  <div class="grid2 g-b">
    <section class="card"><h2>Top products by revenue</h2><div class="cv"><canvas id="cTop" role="img" aria-label="Top products"></canvas></div></section>
    <section class="card"><h2>Orders by day of week</h2><div class="cv"><canvas id="cDow" role="img" aria-label="Orders by weekday"></canvas></div></section>
  </div>
  <section class="card"><h2>Product performance</h2><div class="scroll"><table id="tProd"></table></div></section>
  <section class="card"><h2>Recent orders</h2><div class="scroll"><table id="tOrders"></table></div></section>
</main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script src="script.js"></script>
</body>
</html>
